<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAGCOR游戏分类需求 · 原型</title>
<link rel="stylesheet" href="prototype.css">
<style>
  html, body { height: 100%; overflow: auto; }
  #stage { transform-origin: 0 0; }
  #sizer { position: relative; }
</style>
</head>
<body>
<div id="sizer"><div id="stage"><div id="app"></div></div></div>
<script src="../assets/vendor/htm-preact-standalone.umd.js"></script>
<script src="prototype.js"></script>
<script>
  // 原型按 1920×960 设计。fit=1（默认）时按窗口宽度等比缩放；fit=0 时按原尺寸显示。
  (function () {
    var stage = document.getElementById('stage'), sizer = document.getElementById('sizer');
    function fitMode() { return !/[?&#]fit=0/.test(location.href); }
    function apply() {
      var s = fitMode() ? Math.min(1, document.documentElement.clientWidth / 1920) : 1;
      stage.style.transform = 'scale(' + s + ')';
      sizer.style.width = (1920 * s) + 'px';
      sizer.style.height = (960 * s) + 'px';
    }
    window.addEventListener('resize', apply);
    window.addEventListener('hashchange', apply);
    window.addEventListener('message', function (e) { if (e.data && e.data.type === 'fit') { location.hash = e.data.fit ? '' : 'fit=0'; } });
    apply();
  })();
</script>
</body>
</html>
